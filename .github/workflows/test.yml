name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repo policy (skills, links, manifests, public-repo guard)
        run: python -m unittest discover -s tests -v
